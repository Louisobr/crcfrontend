name: End-to-end tests
on: push
jobs:
  cypress-run:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Install dependencies with caching
      # and run all Cypress tests
      - name: Get URI from SSM Parameter Store
        id: get-uri
        uses: aws-actions/aws-ssm-parameter-store@v2
        with:
          name: apiuri
      - name: Cypress run
        uses: cypress-io/github-action@v7
        env:
          CYPRESS_BASE_URL: ${{ steps.get-uri.outputs.parameter_value }}